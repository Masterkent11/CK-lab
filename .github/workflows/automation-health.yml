name: Automation health
on:
  workflow_run:
    workflows: [Engineering CI, Issue and PR lifecycle, Engineering operations, Security monitor]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  failure:
    if: >-
      contains(fromJSON('["failure","timed_out","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: engineering-mutations
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report failed run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_WRITES: ${{ vars.AUTOMATION_WRITES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m automation --apply quality
