name: Issue and PR lifecycle
on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, synchronize, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  lifecycle:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event_name == 'issues' && github.event.sender.type != 'Bot' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
      github.event.label.name == 'qa-approved' || github.event.label.name == 'blocked'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: engineering-mutations
      queue: max
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update linked issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ENGINEERING_PROJECT_NUMBER: ${{ vars.ENGINEERING_PROJECT_NUMBER }}
          AUTOMATION_WRITES: ${{ vars.AUTOMATION_WRITES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          command=issue
          if [[ "$EVENT_NAME" == pull_request_target ]]; then command=pr; fi
          python3 -m automation --apply "$command"
